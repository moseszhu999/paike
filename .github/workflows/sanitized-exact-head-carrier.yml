name: Sanitized exact-head carrier

on:
  pull_request:
    paths:
      - "carriers/**"
      - "scripts/validate_carriers.py"
      - "tests/test_validate_carriers.py"
      - ".github/workflows/sanitized-exact-head-carrier.yml"
  push:
    branches: [main]
    paths:
      - "carriers/**"
      - "scripts/validate_carriers.py"
      - "tests/test_validate_carriers.py"
      - ".github/workflows/sanitized-exact-head-carrier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run synthetic fail-closed contracts
        run: python3 -m unittest -v tests.test_validate_carriers

      - name: Validate sanitized opaque payloads
        run: python3 scripts/validate_carriers.py carriers --output-dir out

      - name: Confirm no obvious private payload classes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find carriers -type f -name '*.json' | wc -l | tr -d ' ')" -ge 1
          if grep -RIE --exclude='*.pyc' --exclude-dir='__pycache__' \
            '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|HYPERLIQUID_(PRIVATE|SECRET)_KEY|TELEGRAM_BOT_TOKEN|api[_-]?key[[:space:]]*[:=])' \
            carriers scripts tests; then
            echo "forbidden sensitive payload class detected" >&2
            exit 1
          fi

      - name: Upload immutable sanitized receipt
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-exact-head-carrier-${{ github.run_id }}
          path: out/carrier-validation-receipt.json
          if-no-files-found: error
          retention-days: 30
